name: Deploy to Heroku

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run gen:prisma

      - name: Build application
        run: npm run build

      # Tests deliberately do NOT run here. Deploying is the emergency lever: it must never be
      # blocked by something outside our control (parts of the suite pull a Postgres image, so a
      # registry outage would ground an urgent fix). Read the Tests workflow result on the PR;
      # decide with it, don't be gated by it.
      #
      # Tests run on PR events only (see tests.yml). A commit pushed STRAIGHT to main therefore
      # reaches production having run no tests anywhere — that is the deliberate cost of the
      # emergency lever, not an oversight. Reserve it for emergencies.

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      # Migrations run in the Procfile `release:` phase — after the build, BEFORE the new slug
      # serves traffic, so a failed migration aborts the release. Do NOT re-add a post-deploy
      # `heroku run npx prisma migrate deploy` here: it duplicates the release phase and runs
      # too late to protect the slug (docs/migrations.md).
      - name: Deploy to Heroku
        if: success()
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
        env:
          HD_NODE_ENV: 'production'
